name: dotnet-tool-publish

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore src/Dejan.Skills.Tool/Dejan.Skills.Tool.csproj

      - name: Resolve Version From Tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a supported version tag. Use format MAJOR.MINOR.PATCH, vMAJOR.MINOR.PATCH, or prerelease suffix."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Print Resolved Version
        run: echo "Publishing version ${{ steps.version.outputs.version }}"

      - name: Build
        run: dotnet build src/Dejan.Skills.Tool/Dejan.Skills.Tool.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack src/Dejan.Skills.Tool/Dejan.Skills.Tool.csproj -c Release --no-build -o artifacts/nupkg -p:Version=${{ steps.version.outputs.version }}

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejan-skills-nupkg
          path: artifacts/nupkg/*.nupkg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/nupkg/*.nupkg
          name: dejan-skills v${{ steps.version.outputs.version }}

      - name: Publish To NuGet.org
        if: startsWith(github.ref, 'refs/tags/') && env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate